<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Torneo TMS - Generador de Llaves</title>
    <style>
        /* ----- RESET Y ESTILOS GENERALES ----- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #302d7c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .app {
            max-width: 1400px;
            width: 100%;
            background: #f4f3f1;
            border-radius: 32px 32px 24px 24px;
            padding: 30px 25px 40px 25px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ----- HEADER Y CONTROLES ----- */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 3px solid #d6d3cc;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 2.1rem;
            font-weight: 800;
            color: #302d7c;
            letter-spacing: -0.5px;
        }
        .header h1 span {
            background: #870f0b;
            color: #f4f3f1;
            padding: 0 16px;
            border-radius: 40px;
            font-size: 1.4rem;
            margin-left: 6px;
            box-shadow: 0 4px 15px rgba(135, 15, 11, 0.4);
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .controls label {
            font-weight: 600;
            color: #302d7c;
            font-size: 1rem;
        }
        .controls select {
            padding: 10px 20px;
            border-radius: 30px;
            border: 2px solid #302d7c;
            background: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            color: #302d7c;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls select:hover {
            background: #ececf8;
            transform: scale(1.02);
        }
        .btn-reset {
            background: #870f0b;
            color: #f4f3f1;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 10px rgba(135, 15, 11, 0.3);
        }
        .btn-reset:hover {
            background: #6a0b08;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(135, 15, 11, 0.5);
        }

        /* Mensaje informativo */
        .info-note {
            background: #ececf8;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #302d7c;
            margin-bottom: 20px;
            display: inline-block;
            border: 1px solid #d6d3cc;
        }
        .info-note strong {
            color: #870f0b;
        }

        /* ----- BRACKET (CONTENEDOR PRINCIPAL) ----- */
        .bracket-wrapper {
            position: relative;
            overflow-x: auto;
            padding: 20px 10px 20px 10px;
        }
        .bracket {
            display: flex;
            flex-direction: row;
            gap: 40px;
            justify-content: center;
            min-width: fit-content;
            position: relative;
        }

        /* ----- SVG DE CONEXIONES (LÍNEAS) ----- */
        #lineSvg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        #lineSvg path {
            stroke: #302d7c;
            stroke-width: 2.5;
            fill: none;
            stroke-linejoin: round;
            opacity: 0.5;
            transition: opacity 0.3s ease, stroke-width 0.3s ease;
        }
        .bracket-wrapper:hover #lineSvg path {
            opacity: 1;
            stroke-width: 3.5;
        }

        /* ----- CADA RONDA ----- */
        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 12px;
            min-width: 170px;
            flex: 1 1 0;
            z-index: 2;
            position: relative;
        }
        .round-title {
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: #302d7c;
            color: #f4f3f1;
            padding: 8px 12px;
            border-radius: 30px;
            text-align: center;
            margin-bottom: 8px;
            border: none;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(48, 45, 124, 0.3);
        }
        .round:hover .round-title {
            transform: scale(1.03);
            box-shadow: 0 4px 15px rgba(48, 45, 124, 0.5);
        }

        /* ----- PARTIDO ----- */
        .match {
            background: #ffffff;
            border: 2px solid #d6d3cc;
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: 0 2px 6px rgba(48, 45, 124, 0.08);
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
            z-index: 2;
        }
        .match:hover {
            border-color: #870f0b;
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 12px 30px rgba(135, 15, 11, 0.15);
            z-index: 10;
        }
        .match.has-winner {
            border-color: #870f0b;
            background: #fdf5f4;
            animation: pulseWinner 2s infinite ease-in-out;
        }
        @keyframes pulseWinner {
            0% {
                box-shadow: 0 0 0 0 rgba(135, 15, 11, 0.2);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(135, 15, 11, 0.05);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(135, 15, 11, 0);
            }
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .team-name {
            border: none;
            background: transparent;
            font-weight: 500;
            font-size: 0.95rem;
            color: #302d7c;
            padding: 4px 6px;
            width: 65%;
            border-bottom: 2px solid transparent;
            transition: 0.15s;
            font-family: inherit;
        }
        /* Estilo para nombres no editables (rondas > 0) */
        .team-name-readonly {
            background: transparent;
            border-bottom: 2px solid #d6d3cc;
            color: #1a1a3a;
            cursor: default;
            font-weight: 600;
        }
        .team-name-readonly:hover {
            background: transparent;
            border-radius: 0;
        }
        /* Nombres editables (ronda 0) */
        .team-name-editable:hover {
            background: #ececf8;
            border-radius: 6px;
        }
        .team-name-editable:focus {
            outline: none;
            border-bottom-color: #870f0b;
            background: #ececf8;
            border-radius: 6px;
        }

        .score-input {
            width: 44px;
            text-align: center;
            font-weight: 700;
            font-size: 1rem;
            border: 2px solid #d6d3cc;
            border-radius: 8px;
            padding: 4px 0;
            background: #ffffff;
            color: #302d7c;
            transition: all 0.2s;
            font-family: inherit;
        }
        .score-input:focus {
            outline: none;
            border-color: #870f0b;
            box-shadow: 0 0 0 5px rgba(135, 15, 11, 0.15);
            transform: scale(1.05);
            background: #fefefe;
        }
        .score-input:hover {
            border-color: #302d7c;
        }
        .score-input::-webkit-inner-spin-button,
        .score-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .score-input {
            -moz-appearance: textfield;
        }

        /* ----- CAMPEÓN ----- */
        .champion-box {
            margin-top: 30px;
            padding: 20px 25px;
            background: #870f0b;
            border-radius: 60px;
            text-align: center;
            border: 2px solid #302d7c;
            display: none;
            transform: scale(0.8);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 30px rgba(135, 15, 11, 0.4);
        }
        .champion-box.show {
            display: block;
            animation: championReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes championReveal {
            0% {
                transform: scale(0.5) rotate(-3deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        .champion-box h2 {
            font-size: 2.2rem;
            color: #f4f3f1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .champion-box h2 span {
            background: #302d7c;
            padding: 6px 30px;
            border-radius: 60px;
            color: #f4f3f1;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            font-weight: 800;
            display: inline-block;
            animation: glowText 1.8s infinite alternate;
        }
        @keyframes glowText {
            0% {
                box-shadow: 0 4px 20px rgba(48, 45, 124, 0.3);
                transform: scale(1);
            }
            100% {
                box-shadow: 0 4px 40px rgba(135, 15, 11, 0.7), 0 0 60px rgba(48, 45, 124, 0.3);
                transform: scale(1.02);
            }
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 900px) {
            .app {
                padding: 16px;
            }
            .header {
                flex-direction: column;
                align-items: start;
                gap: 12px;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .bracket {
                gap: 20px;
            }
            .round {
                min-width: 140px;
            }
            .match {
                padding: 10px;
            }
            .team-name {
                font-size: 0.8rem;
                width: 55%;
            }
            .score-input {
                width: 34px;
                font-size: 0.85rem;
            }
        }
        @media (max-width: 600px) {
            .round {
                min-width: 120px;
            }
            .match {
                padding: 8px;
            }
            .team-name {
                font-size: 0.7rem;
            }
            .score-input {
                width: 28px;
                font-size: 0.75rem;
                padding: 2px 0;
            }
            .controls select {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
            .champion-box h2 {
                font-size: 1.4rem;
            }
            .champion-box h2 span {
                padding: 4px 16px;
            }
            .info-note {
                font-size: 0.75rem;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- CABECERA -->
        <div class="header">
            <h1>⚽ Torneo <span>TMS</span></h1>
            <div class="controls">
                <label for="teamSelect">Equipos:</label>
                <select id="teamSelect">
                    <option value="8">8 (Cuartos)</option>
                    <option value="16" selected>16 (Octavos)</option>
                    <option value="32">32 (Dieciseisavos)</option>
                </select>
                <button class="btn-reset" id="resetBtn">🔄 Reiniciar</button>
            </div>
        </div>

        <!-- Mensaje informativo -->
        <div class="info-note">
            ✏️ <strong>Edita solo los nombres de los equipos en la primera ronda</strong> — los ganadores pasan automáticamente a las siguientes fases.
        </div>

        <!-- BRACKET -->
        <div class="bracket-wrapper">
            <svg id="lineSvg"></svg>
            <div class="bracket" id="bracketContainer"></div>
        </div>

        <!-- CAMPEÓN -->
        <div class="champion-box" id="championBox">
            <h2>🏆 Campeón: <span id="championName">---</span></h2>
        </div>
    </div>

    <script>
        (function() {
            // ----- ESTADO GLOBAL -----
            let tournament = {
                teamCount: 16,
                rounds: []
            };

            const bracketContainer = document.getElementById('bracketContainer');
            const teamSelect = document.getElementById('teamSelect');
            const resetBtn = document.getElementById('resetBtn');
            const championBox = document.getElementById('championBox');
            const championName = document.getElementById('championName');
            const lineSvg = document.getElementById('lineSvg');

            // ----- NOMBRES DE RONDAS -----
            const ROUND_NAMES = {
                8: ['Cuartos de Final', 'Semifinal', 'Final'],
                16: ['Octavos de Final', 'Cuartos de Final', 'Semifinal', 'Final'],
                32: ['Dieciseisavos', 'Octavos de Final', 'Cuartos de Final', 'Semifinal', 'Final']
            };

            // ----- FUNCIÓN PARA INICIALIZAR TORNEO -----
            function initTournament(teamCount) {
                const roundsCount = Math.log2(teamCount);
                const rounds = [];
                let matchesPerRound = teamCount / 2;

                for (let r = 0; r < roundsCount; r++) {
                    const roundName = ROUND_NAMES[teamCount]?.[r] || `Ronda ${r+1}`;
                    const matches = [];
                    for (let m = 0; m < matchesPerRound; m++) {
                        const team1 = `Equipo ${m * 2 + 1}`;
                        const team2 = `Equipo ${m * 2 + 2}`;
                        matches.push({
                            team1: team1,
                            team2: team2,
                            score1: '',
                            score2: ''
                        });
                    }
                    rounds.push({ name: roundName, matches: matches });
                    matchesPerRound = matchesPerRound / 2;
                }

                tournament.teamCount = teamCount;
                tournament.rounds = rounds;
                championBox.classList.remove('show');
                championName.textContent = '---';
            }

            // ----- ACTUALIZAR GANADORES (PROPAGACIÓN) -----
            function updateWinners() {
                const rounds = tournament.rounds;
                for (let r = 0; r < rounds.length - 1; r++) {
                    const currentMatches = rounds[r].matches;
                    const nextMatches = rounds[r + 1].matches;

                    for (let m = 0; m < currentMatches.length; m++) {
                        const match = currentMatches[m];
                        const s1 = parseInt(match.score1) || 0;
                        const s2 = parseInt(match.score2) || 0;
                        let winner = null;

                        if (s1 > s2) winner = match.team1;
                        else if (s2 > s1) winner = match.team2;

                        const nextMatchIndex = Math.floor(m / 2);
                        if (nextMatchIndex < nextMatches.length) {
                            const target = nextMatches[nextMatchIndex];
                            const isEven = m % 2 === 0;
                            if (isEven) {
                                target.team1 = winner !== null ? winner : '---';
                            } else {
                                target.team2 = winner !== null ? winner : '---';
                            }
                        }
                    }
                }

                // Detectar campeón (última ronda)
                const lastRound = rounds[rounds.length - 1];
                if (lastRound && lastRound.matches.length === 1) {
                    const final = lastRound.matches[0];
                    const s1 = parseInt(final.score1) || 0;
                    const s2 = parseInt(final.score2) || 0;
                    if (s1 > s2) {
                        championName.textContent = final.team1;
                        championBox.classList.add('show');
                    } else if (s2 > s1) {
                        championName.textContent = final.team2;
                        championBox.classList.add('show');
                    } else {
                        if (final.score1 !== '' || final.score2 !== '') {
                            championName.textContent = 'Empate en la final';
                            championBox.classList.add('show');
                        } else {
                            championBox.classList.remove('show');
                        }
                    }
                } else {
                    championBox.classList.remove('show');
                }
            }

            // ----- DIBUJAR LÍNEAS DE CONEXIÓN (SVG) -----
            function drawLines() {
                const wrapper = document.querySelector('.bracket-wrapper');
                const svgRect = lineSvg.getBoundingClientRect();
                lineSvg.innerHTML = '';

                const rounds = document.querySelectorAll('.round');
                if (rounds.length < 2) return;

                for (let i = 0; i < rounds.length - 1; i++) {
                    const currentMatches = rounds[i].querySelectorAll('.match');
                    const nextMatches = rounds[i + 1].querySelectorAll('.match');

                    currentMatches.forEach((match, idx) => {
                        const nextIdx = Math.floor(idx / 2);
                        if (nextIdx >= nextMatches.length) return;
                        const nextMatch = nextMatches[nextIdx];

                        const rect1 = match.getBoundingClientRect();
                        const rect2 = nextMatch.getBoundingClientRect();

                        const x1 = rect1.right - svgRect.left;
                        const y1 = rect1.top + rect1.height / 2 - svgRect.top;
                        const x2 = rect2.left - svgRect.left;
                        const y2 = rect2.top + rect2.height / 2 - svgRect.top;

                        const midX = (x1 + x2) / 2;

                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        const d = `M ${x1} ${y1} L ${midX} ${y1} V ${y2} L ${x2} ${y2}`;
                        path.setAttribute('d', d);
                        path.setAttribute('stroke', '#302d7c');
                        path.setAttribute('stroke-width', '2.5');
                        path.setAttribute('fill', 'none');
                        path.setAttribute('stroke-linejoin', 'round');
                        lineSvg.appendChild(path);
                    });
                }
            }

            // ----- RENDERIZAR EL BRACKET EN EL DOM (con readonly en rondas > 0) -----
            function renderBracket() {
                const rounds = tournament.rounds;
                bracketContainer.innerHTML = '';

                rounds.forEach((round, rIdx) => {
                    const roundDiv = document.createElement('div');
                    roundDiv.className = 'round';

                    const title = document.createElement('div');
                    title.className = 'round-title';
                    title.textContent = round.name;
                    roundDiv.appendChild(title);

                    round.matches.forEach((match, mIdx) => {
                        const matchDiv = document.createElement('div');
                        matchDiv.className = 'match';
                        matchDiv.dataset.round = rIdx;
                        matchDiv.dataset.match = mIdx;

                        const s1 = parseInt(match.score1) || 0;
                        const s2 = parseInt(match.score2) || 0;
                        if (s1 > s2 || s2 > s1) {
                            matchDiv.classList.add('has-winner');
                        }

                        // --- Fila 1 (Equipo 1) ---
                        const row1 = document.createElement('div');
                        row1.className = 'team-row';

                        const name1 = document.createElement('input');
                        name1.type = 'text';
                        name1.className = 'team-name';
                        // Si es la primera ronda (rIdx === 0) es editable, sino readonly
                        if (rIdx === 0) {
                            name1.classList.add('team-name-editable');
                            name1.readOnly = false;
                        } else {
                            name1.classList.add('team-name-readonly');
                            name1.readOnly = true;
                        }
                        name1.value = match.team1;
                        name1.dataset.round = rIdx;
                        name1.dataset.match = mIdx;
                        name1.dataset.slot = '1';
                        name1.placeholder = 'Equipo';

                        const score1 = document.createElement('input');
                        score1.type = 'number';
                        score1.className = 'score-input';
                        score1.value = match.score1 !== '' ? match.score1 : '';
                        score1.dataset.round = rIdx;
                        score1.dataset.match = mIdx;
                        score1.dataset.slot = '1';
                        score1.placeholder = '0';
                        score1.min = '0';

                        row1.appendChild(name1);
                        row1.appendChild(score1);
                        matchDiv.appendChild(row1);

                        // --- Fila 2 (Equipo 2) ---
                        const row2 = document.createElement('div');
                        row2.className = 'team-row';

                        const name2 = document.createElement('input');
                        name2.type = 'text';
                        name2.className = 'team-name';
                        if (rIdx === 0) {
                            name2.classList.add('team-name-editable');
                            name2.readOnly = false;
                        } else {
                            name2.classList.add('team-name-readonly');
                            name2.readOnly = true;
                        }
                        name2.value = match.team2;
                        name2.dataset.round = rIdx;
                        name2.dataset.match = mIdx;
                        name2.dataset.slot = '2';
                        name2.placeholder = 'Equipo';

                        const score2 = document.createElement('input');
                        score2.type = 'number';
                        score2.className = 'score-input';
                        score2.value = match.score2 !== '' ? match.score2 : '';
                        score2.dataset.round = rIdx;
                        score2.dataset.match = mIdx;
                        score2.dataset.slot = '2';
                        score2.placeholder = '0';
                        score2.min = '0';

                        row2.appendChild(name2);
                        row2.appendChild(score2);
                        matchDiv.appendChild(row2);

                        roundDiv.appendChild(matchDiv);
                    });

                    bracketContainer.appendChild(roundDiv);
                });

                requestAnimationFrame(() => {
                    drawLines();
                });
            }

            // ----- GUARDAR FOCUS -----
            let activeElementId = null;
            function saveFocus() {
                const active = document.activeElement;
                if (active && (active.classList.contains('team-name') || active.classList.contains('score-input'))) {
                    activeElementId = active.id;
                } else {
                    activeElementId = null;
                }
            }
            function restoreFocus() {
                if (activeElementId) {
                    const el = document.getElementById(activeElementId);
                    if (el) el.focus();
                    activeElementId = null;
                }
            }
            function assignIds() {
                document.querySelectorAll('.team-name, .score-input').forEach(el => {
                    const r = el.dataset.round;
                    const m = el.dataset.match;
                    const s = el.dataset.slot;
                    const type = el.classList.contains('team-name') ? 'name' : 'score';
                    el.id = `input-${type}-${r}-${m}-${s}`;
                });
            }

            // ----- ACTUALIZAR TODO -----
            function updateAndRender() {
                saveFocus();
                updateWinners();
                renderBracket();
                assignIds();
                restoreFocus();
            }

            // ----- MANEJADORES DE EVENTOS (DELEGACIÓN) -----
            bracketContainer.addEventListener('input', function(e) {
                const target = e.target;

                // Solo procesamos cambios en nombres si son editables (ronda 0)
                if (target.classList.contains('team-name') && !target.readOnly) {
                    const r = parseInt(target.dataset.round);
                    const m = parseInt(target.dataset.match);
                    const s = parseInt(target.dataset.slot);
                    const round = tournament.rounds[r];
                    if (round) {
                        const match = round.matches[m];
                        if (match) {
                            const key = `team${s}`;
                            match[key] = target.value;
                            updateAndRender();
                        }
                    }
                    return;
                }

                // Cambios en marcadores (siempre editables)
                if (target.classList.contains('score-input')) {
                    const r = parseInt(target.dataset.round);
                    const m = parseInt(target.dataset.match);
                    const s = parseInt(target.dataset.slot);
                    const value = target.value;
                    const round = tournament.rounds[r];
                    if (round) {
                        const match = round.matches[m];
                        if (match) {
                            const key = `score${s}`;
                            match[key] = value;
                            updateAndRender();
                        }
                    }
                    return;
                }
            });

            // ----- REINICIAR -----
            function resetTournament() {
                const teamCount = parseInt(teamSelect.value);
                initTournament(teamCount);
                renderBracket();
                assignIds();
                championBox.classList.remove('show');
                championName.textContent = '---';
            }

            function changeTeamCount() {
                const teamCount = parseInt(teamSelect.value);
                initTournament(teamCount);
                renderBracket();
                assignIds();
                championBox.classList.remove('show');
                championName.textContent = '---';
            }

            // ----- EVENT LISTENERS -----
            teamSelect.addEventListener('change', changeTeamCount);
            resetBtn.addEventListener('click', resetTournament);

            let resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    drawLines();
                }, 150);
            });

            // ----- INICIALIZAR -----
            initTournament(16);
            renderBracket();
            assignIds();

            document.addEventListener('focusin', function(e) {
                if (e.target.classList.contains('team-name') || e.target.classList.contains('score-input')) {
                    activeElementId = e.target.id;
                }
            });

        })();
    </script>
</body>
</html>
